[workspace]
name = "ai-toolkit-environment"
version = "0.1.0"
description = "Python 3.12 interpreter that the Ostris AI Toolkit runtime venv is built from"
channels = ["conda-forge"]
platforms = ["linux-64"]

# The interpreter ONLY.
#
# ai-toolkit's own dependency set is deliberately NOT declared here. Upstream pins
# a git revision of diffusers alongside torchao/transformers/peft versions that
# are solved together (and re-solved by upstream on its own cadence), so this pod
# builds ai-toolkit's runtime venv from the pinned commit's own requirements.txt
# at image-build time — the same shape pod-unsloth-studio uses for the Unsloth
# Studio runtime venv. What pixi owns is the thing that must be reproducible and
# is NOT upstream's business: the Python MINOR VERSION. ai-toolkit requires
# >=3.10 and recommends 3.12, and the Arch host python is newer than the wheels
# torch ships.
[dependencies]
python = "==3.12.*"
pip = "*"

[environments]
default = { features = [], solve-group = "default" }
