ai-toolkit-cdi:
    candy:
        base: podcdi.pod-cdi
        platform:
            - linux/amd64
        candy:
            # The candy THIS repo owns: the box proves the tree, not a pinned copy of itself.
            # The CUDA substrate arrives from the CDI pod base (`podcdi.pod-cdi` composes
            # layer-cdi → layer-cuda), which is why the candy carries no layer-cuda require
            # (opencharly/layer-cuda#34 item 6): the box is a genuine class-1, toolkit-free
            # image.
            - ai-toolkit
            - '@github.com/opencharly/pod-dbus:v2026.274.0648'
